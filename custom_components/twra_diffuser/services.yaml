set_working_mode:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: twra_diffuser
    mode:
      required: true
      default: 1
      selector:
        number:
          min: 1
          max: 5
          mode: box
    enabled:
      selector:
        boolean:
    days:
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    start:
      selector:
        time:
    end:
      selector:
        time:
    run_seconds:
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s
          mode: box
    pause_seconds:
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
