set_spray_cycle:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: twra_diffuser
    run_seconds:
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: s
          mode: box
    pause_seconds:
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
